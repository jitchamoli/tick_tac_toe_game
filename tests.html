<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decay Tic-Tac-Toe — tests and proof</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tests">
<h1>Decay Tic-Tac-Toe — tests and proof</h1>
<p class="intro">
  Unit checks on the rules, then an exhaustive walk of the entire reachable game
  tree asserting that no game can end in a draw and that every game terminates.
  <a href="index.html">Back to the game</a>.
</p>
<div id="results"><p class="running">Running…</p></div>

<script type="module">
  import { runAll } from './test/harness.js';
  import './test/engine-tests.js';
  import './test/proof-tests.js';

  const target = document.querySelector('#results');
  target.textContent = '';
  const { failed } = await runAll(target);
  document.title = `${failed === 0 ? 'PASS' : 'FAIL'} — Decay Tic-Tac-Toe tests`;
</script>
</body>
</html>
